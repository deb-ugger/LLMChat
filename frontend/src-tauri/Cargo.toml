[package]
name = "llmchat"
version = "0.1.0"
description = "LLMChat Tauri frontend"
authors = ["you"]
edition = "2021"

[lib]
name = "llmchat_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false }
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
clipboard-win = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
# Avoid unresolved internal Rust symbols when MSVC links reused codegen units.
incremental = false
